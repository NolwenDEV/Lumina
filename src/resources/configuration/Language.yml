    DATABASE_DISABLED: "{PREFIX} &cDatabase is disabled, this feature has been disabled !"
    
    PLAYER_NOT_FOUND: "{PREFIX} &cPlayer not found !"
    OFFLINE_PLAYER: "{PREFIX} &cThis player is not online !"
    
    AUTHENTICATION:

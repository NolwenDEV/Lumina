GUI:
    FILTER:
        TITLE: "&dFilter"
        BUTTON:
            SEPARATOR:
                MATERIAL: "PINK_STAINED_GLASS_PANE"
                NAME: " "
            
            TOGGLE:
                ENABLE:
                    MATERIAL: "GREEN_WOOL"
                    NAME: "&aEnable"
                    LORE:
                        - "&7Click to &aenable &7filter !"
                DISABLE:
                    MATERIAL: "RED_WOOL"
                    NAME: "&cDisable"
                    LORE:
                        - "&7Click to &cdisable &7filter !"
                        
            DESTROYER:
                ENABLE:
                    MATERIAL: "SNOWBALL"
                    NAME: "&aEnable"
                    LORE:
                        - "&7Click to &astart clearing &7ground items that are in your filter !"
                DISABLE:
                    MATERIAL: "FIRE_CHARGE"
                    NAME: "&cDisable"
                    LORE:
                        - "&7Click to &cstop clearing &7ground items that are in your filter !"
                        
            CLEAR:
                MATERIAL: "CAULDRON"
                NAME: "&4Clear"
                LORE:
                    - "&7Click to &4clear &7items in filter !"
            
    BACKPACK:
        TITLE: "&dBackpack"
        SIZE: 3
        
    TRASH:
        TITLE: "&dTrash"
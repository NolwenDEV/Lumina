MESSAGE:
    AUTHENTICATION:
        REGISTER: "{PREFIX} &7Use &8/&fregister &8<&7password&8> &7{CAPTCHA} &7to register !"
        LOGIN: "{PREFIX} &7Use &8/&flogin &8<&7password&8> &7{CAPTCHA} &7to register !"
        
        SUCCESSFULLY_REGISTERED: "{PREFIX} &7You've been successfully registered, your session is valid for &d7 days &7!"
        SUCCESSFULLY_LOGGED_IN: "{PREFIX} &7You've been successfully logged-in, your session is valid for &d7 days &7!"
        
    HOME:
        CREATED: "{PREFIX} &7Home &d{HOME} &7successfully created !"
        DELETED: "{PREFIX} &7Home &d{HOME} &7successfully deleted !"
        
        LIST:
            MESSAGE: "{PREFIX} &7Here's your home list :"
            HOMES: "  &8- &8[&5{WORLD}&8] &d{HOME} &8(&d{X}&8, &d{Y}&8, &d{Z}&8)"
            
        TELEPORTED: "{PREFIX} &7Teleportation to &d{HOME} &7successful !"
        HOVER: "&7Click to be teleported to your home &8: &d{HOME}"
        
    FILTER:
        TOGGLE:
            ENABLED: "{PREFIX} &7Your filter has been &aenabled &7!"
            DISABLED: "{PREFIX} &7Your filter has been &cdisabled &7!"
        DESTROYER:
            ENABLED: "{PREFIX} &7Ground items that are on your filter will &astart being destroyed &7!"
            DISABLED: "{PREFIX} &7Ground items that are on your filter will &cstop being destroyed &7!"
            
    TELEPORTATION:
        REQUEST_SENT: "{PREFIX} &7A teleportation request has been sent to &d{PLAYER} &7!"
        REQUEST_RECEIVED: "{PREFIX} &7You've received a teleportation request from &d{PLAYER}&7, do &8/&f{COMMAND} &d{PLAYER} &7to &aaccept &7!"
        
        TELEPORTED_TO: "{PREFIX} &7You've been teleported to &d{PLAYER} &7!"
        TELEPORTED_AT: "{PREFIX} &d{PLAYER} &7has been teleported at your location !"
            
    BACK:
        REMINDER: "{PREFIX} &7Use &8/&dback &7to return to your last death location !"
        
    TRASH:
        COUNTER: "{PREFIX} &7A total of &d{COUNT} items &7has been destroyed !"
    
ERROR:

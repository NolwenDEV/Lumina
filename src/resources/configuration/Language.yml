        ALREADY_REGISTERED: "{PREFIX} &cYou're already registered, use &7/&flogin &8<&7password&8> &8<&7captcha&8> &7instead !"
        ALREADY_LOGGED_IN: "{PREFIX} &cYou're already logged-in !"
        
        PASSWORD_TOO_LONG: "{PREFIX} &cYour password can't be longer than 24 characters !"
    
